<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lace Gallery - Tanvir Suta Ghar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="gallery-header">
    <a href="index.html" class="back-btn">← Home</a>
    <h1>Tanvir Suta Ghar</h1>
    <p>Lace Gallery</p>
</header>

<section class="lace-categories">

    <a href="#fancy" class="lace-category">
        <div class="category-icon">✨</div>
        <h2>Fancy Lace</h2>
        <p>View Collection</p>
    </a>

    <a href="#jari" class="lace-category">
        <div class="category-icon">🌟</div>
        <h2>Jari Lace</h2>
        <p>View Collection</p>
    </a>

    <a href="#cotton" class="lace-category">
        <div class="category-icon">🧵</div>
        <h2>Cotton Lace</h2>
        <p>View Collection</p>
    </a>

</section>


<!-- FANCY LACE -->

<section id="fancy" class="lace-section">

    <h2>Fancy Lace</h2>

    <div class="lace-grid">

        <div class="lace-item">
            <img src="lace/fancy/1.jpg" alt="Fancy Lace">
        </div>

        <div class="lace-item">
            <img src="lace/fancy/2.jpg" alt="Fancy Lace">
        </div>

        <div class="lace-item">
            <img src="lace/fancy/3.jpg" alt="Fancy Lace">
        </div>

        <div class="lace-item">
            <img src="lace/fancy/4.jpg" alt="Fancy Lace">
        </div>

        <div class="lace-item">
            <img src="lace/fancy/5.jpg" alt="Fancy Lace">
        </div>

        <div class="lace-item">
            <img src="lace/fancy/6.jpg" alt="Fancy Lace">
        </div>

    </div>

</section>


<!-- JARI LACE -->

<section id="jari" class="lace-section">

    <h2>Jari Lace</h2>

    <div class="lace-grid">

        <div class="empty-category">
            Jari Lace Collection Coming Soon
        </div>

    </div>

</section>


<!-- COTTON LACE -->

<section id="cotton" class="lace-section">

    <h2>Cotton Lace</h2>

    <div class="lace-grid">

        <div class="empty-category">
            Cotton Lace Collection Coming Soon
        </div>

    </div>

</section>


<footer>
    <p>© 2026 Tanvir Suta Ghar</p>
</footer>

</body>
</html>
