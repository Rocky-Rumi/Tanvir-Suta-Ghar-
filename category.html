<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lace Gallery | Tanvir Suta Ghar</title>

<link rel="stylesheet" href="style.css">

<style>

.lace-tabs{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:35px;
}

.lace-tab{
border:0;
background:#eee;
color:#333;
padding:11px 22px;
border-radius:25px;
cursor:pointer;
font-weight:bold;
}

.lace-tab.active{
background:#a56b3f;
color:white;
}

.lace-gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}

.lace-item{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.08);
border:1px solid #eee;
}

.lace-item img{
width:100%;
height:240px;
object-fit:cover;
display:block;
cursor:pointer;
}

.lace-info{
padding:14px;
}

.lace-info h3{
font-size:16px;
margin-bottom:4px;
}

.lace-info p{
font-size:13px;
color:#777;
}

.empty{
grid-column:1/-1;
text-align:center;
padding:50px 20px;
background:white;
border-radius:15px;
color:#777;
}

@media(max-width:900px){
.lace-gallery{
grid-template-columns:repeat(3,1fr);
}
}

@media(max-width:600px){
.lace-gallery{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.lace-item img{
height:180px;
}

.lace-info{
padding:10px;
}

.lace-info h3{
font-size:14px;
}
}

</style>

</head>


<body>


<header>

<nav class="navbar">

<a href="index.html" class="logo">

Tanvir Suta Ghar

<span>
THREADS • LACE • CRAFT
</span>

</a>

<ul class="nav-links">

<li>
<a href="index.html">Home</a>
</li>

<li>
<a href="index.html#categories">Categories</a>
</li>

<li>
<a href="index.html#contact">Contact</a>
</li>

</ul>

</nav>

</header>


<section class="page-hero">

<h1>Lace Gallery</h1>

<p>
Explore our Fancy Lace, Jari Lace and Cotton Lace collection.
</p>

<a href="index.html" class="back-btn">
← Back to Home
</a>

</section>


<section class="section">


<div class="lace-tabs">

<button class="lace-tab active"
onclick="showLace('fancy',this)">
Fancy Lace
</button>

<button class="lace-tab"
onclick="showLace('jari',this)">
Jari Lace
</button>

<button class="lace-tab"
onclick="showLace('cotton',this)">
Cotton Lace
</button>

</div>


<div
id="laceGallery"
class="lace-gallery">
</div>


</section>


<footer>

<p>
<strong>Tanvir Suta Ghar</strong>
</p>

<p>
Threads • Lace • Yarn • Resin • Craft Materials
</p>

<p>
© 2026 Tanvir Suta Ghar. All Rights Reserved.
</p>

</footer>



<script>


/*
========================================
LACE PRODUCT LIST
========================================

শুধু এখানে নতুন ছবির নাম যোগ করবে।

Example:

"fancy-001.jpg"

ছবিটি থাকতে হবে:

images/lace/fancy/fancy-001.jpg
*/


const laceProducts = {


fancy: [

{
image:"fancy-001.jpg",
name:"Fancy Lace 001",
price:"Contact for Price"
},

{
image:"fancy-002.jpg",
name:"Fancy Lace 002",
price:"Contact for Price"
},

{
image:"fancy-003.jpg",
name:"Fancy Lace 003",
price:"Contact for Price"
}

],


jari: [

{
image:"jari-001.jpg",
name:"Jari Lace 001",
price:"Contact for Price"
},

{
image:"jari-002.jpg",
name:"Jari Lace 002",
price:"Contact for Price"
}

],


cotton: [

{
image:"cotton-001.jpg",
name:"Cotton Lace 001",
price:"Contact for Price"
},

{
image:"cotton-002.jpg",
name:"Cotton Lace 002",
price:"Contact for Price"
}

]

};



function showLace(type,button){


document
.querySelectorAll(".lace-tab")
.forEach(function(tab){

tab.classList.remove("active");

});


button.classList.add("active");


const gallery =
document.getElementById("laceGallery");


const products =
laceProducts[type];


if(!products || products.length===0){

gallery.innerHTML=`

<div class="empty">

<h3>No products added yet.</h3>

<p>
Product images will appear here.
</p>

</div>

`;

return;

}


gallery.innerHTML="";


products.forEach(function(product){


const card=document.createElement("div");

card.className="lace-item";


card.innerHTML=`

<img
src="images/lace/${type}/${product.image}"
alt="${product.name}"
onclick="window.open(this.src,'_blank')"
onerror="this.parentElement.style.display='none'"
>


<div class="lace-info">

<h3>
${product.name}
</h3>

<p>
${product.price}
</p>

</div>

`;


gallery.appendChild(card);


});


}


showLace(
"fancy",
document.querySelector(".lace-tab")
);


</script>


</body>
</html>
